spring.application.name=nirgi-java

# YEAR/MONTH/DAY are H2 keywords but plain column names in the entities
spring.datasource.url=jdbc:h2:mem:nirgi;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,MONTH,DAY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# CorsProperties binds the record component "allowedOrigins" (env var CORS_ALLOWED_ORIGINS in production)
cors.allowed-origins=http://localhost:8080

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.web.resources.static-locations=classpath:/static/

spring.jackson.time-zone=Europe/Tallinn
