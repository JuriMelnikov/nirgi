<!DOCTYPE html>
<html lang="ru" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модели и операции</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <div class="container mx-auto p-4 lg:p-8">
        <div class="grid lg:grid-cols-2 gap-8">
            <!-- Add Model List Form -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body p-4">
                    <h2 id="modelListFormHeader" class="card-title text-base leading-none mb-2 cursor-pointer hover:text-primary transition-colors">
                        <svg id="modelListFormIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                        </svg>
                        <span id="modelListFormTitle">Модели</span>
                        <svg id="modelListChevron" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-auto transform transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </h2>
                    <div id="modelListFormContent" class="hidden">
                    <form id="addModelListForm" class="space-y-1">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-medium">Название модели</span>
                            </label>
                            <input type="text" id="modelListName" name="name" required class="input input-bordered w-full h-[25px] min-h-[25px] text-sm" placeholder="Введите название модели">
                        </div>
                        <div class="form-control mt-6">
                            <div class="flex gap-2">
                                <button type="submit" id="modelListSubmitButton" class="btn btn-primary flex-1 h-[25px] min-h-[25px] text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                    </svg>
                                    <span id="modelListSubmitButtonText">Добавить модель</span>
                                </button>
                                <button type="button" id="modelListCancelButton" class="btn btn-error hidden h-[25px] min-h-[25px] text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                    Отменить
                                </button>
                                <button type="button" id="modelListDeleteButton" class="btn btn-error hidden h-[25px] min-h-[25px] text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                    Удалить
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <div class="divider">Существующие модели</div>
                    <div id="modelListsList">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-medium">Выберите модель</span>
                            </label>
                            <select id="modelListSelect" class="select select-bordered w-full h-[25px] min-h-[25px] text-sm">
                                <option value="">-- Выберите модель --</option>
                                <option th:each="modelList : ${modelLists}" th:value="${modelList.id}" th:text="${modelList.name}"></option>
                            </select>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <!-- Add Section List Form -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body p-4">
                    <h2 id="sectionListFormHeader" class="card-title text-base leading-none mb-2 cursor-pointer hover:text-primary transition-colors">
                        <svg id="sectionListFormIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <span id="sectionListFormTitle">Разделы</span>
                        <svg id="sectionListChevron" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-auto transform transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </h2>
                    <div id="sectionListFormContent" class="hidden">
                    <form id="addSectionListForm" class="space-y-1">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-medium">Название раздела</span>
                            </label>
                            <input type="text" id="sectionListName" name="name" required class="input input-bordered w-full h-[25px] min-h-[25px] text-sm" placeholder="Введите название раздела">
                        </div>
                        <div class="form-control mt-6">
                            <div class="flex gap-2">
                                <button type="submit" id="sectionListSubmitButton" class="btn btn-primary flex-1 h-[25px] min-h-[25px] text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                    </svg>
                                    <span id="sectionListSubmitButtonText">Добавить раздел</span>
                                </button>
                                <button type="button" id="sectionListCancelButton" class="btn btn-error hidden h-[25px] min-h-[25px] text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                    Отменить
                                </button>
                                <button type="button" id="sectionListDeleteButton" class="btn btn-error hidden h-[25px] min-h-[25px] text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                    Удалить
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <div class="divider">Существующие разделы</div>
                    <div id="sectionListsList">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-medium">Выберите раздел</span>
                            </label>
                            <select id="sectionListSelect" class="select select-bordered w-full h-[25px] min-h-[25px] text-sm">
                                <option value="">-- Выберите раздел --</option>
                                <option th:each="sectionList : ${sectionLists}" th:value="${sectionList.id}" th:text="${sectionList.name}"></option>
                            </select>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <!-- Add Techmap Form -->
            <div class="card bg-base-100 shadow-xl lg:col-span-2">
                <div class="card-body p-4">
                    <h2 class="card-title text-base leading-none mb-1">
                        <svg id="techmapFormIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                        </svg>
                        <span id="techmapFormTitle">Технологическая карта</span>
                    </h2>
                    <form id="addTechmapForm" class="space-y-1">
                        <div class="grid lg:grid-cols-2 gap-4">
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Модель</span>
                                </label>
                                <select id="techmapModelList" name="modelListId" required class="select select-bordered w-full h-[25px] min-h-[25px] text-sm">
                                    <option value="">-- Выберите модель --</option>
                                    <option th:each="modelList : ${modelLists}" th:value="${modelList.id}" th:text="${modelList.name}"></option>
                                </select>
                            </div>
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Раздел</span>
                                </label>
                                <select id="techmapSectionList" name="sectionListId" required class="select select-bordered w-full h-[25px] min-h-[25px] text-sm">
                                    <option value="">-- Выберите раздел --</option>
                                    <option th:each="sectionList : ${sectionLists}" th:value="${sectionList.id}" th:text="${sectionList.name}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-medium">Номер операции</span>
                            </label>
                            <input type="text" id="techmapSerial" name="serial" required class="input input-bordered w-1/2 h-[25px] min-h-[25px] text-sm" placeholder="Введите номер операции">
                        </div>
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-medium">Описание</span>
                            </label>
                            <textarea id="techmapDescriptor" name="descriptor" required class="textarea textarea-bordered w-full h-[25px] min-h-[25px] text-sm" placeholder="Введите описание" rows="1"></textarea>
                        </div>
                        <div class="grid lg:grid-cols-2 gap-4">
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Время (сек)</span>
                                </label>
                                <input type="text" id="techmapTime" name="time" required class="input input-bordered w-1/2 h-[25px] min-h-[25px] text-sm" placeholder="Время выполнения">
                            </div>
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Цена (€)</span>
                                </label>
                                <input type="text" id="techmapPrice" name="price" required class="input input-bordered w-1/2 h-[25px] min-h-[25px] text-sm" placeholder="Цена операции в евро, например 1.50">
                            </div>
                        </div>
                        <div class="form-control mt-[20px]">
                            <div class="flex gap-2">
                                <button type="submit" id="techmapSubmitButton" class="btn btn-primary flex-1 h-[25px] min-h-[25px] text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                    </svg>
                                    <span id="techmapSubmitButtonText">Добавить технологическую карту</span>
                                </button>
                                <button type="button" id="techmapCancelButton" class="btn btn-error hidden h-[25px] min-h-[25px] text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                    Отменить
                                </button>
                            </div>
                        </div>
                    </form>
                    
                    <div class="divider">Существующие технологические карты</div>
                    <div class="overflow-x-auto">
                        <table id="techmapsTable" class="table table-zebra table-sm w-full p-0 m-0" style="border-collapse: collapse;">
                            <thead>
                                <tr class="p-0 m-0" style="height: 25px;">
                                    <th class="text-center p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;">№ операции</th>
                                    <th class="p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;">Описание</th>
                                    <th class="p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;">Время (сек)</th>
                                    <th class="p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;">Цена (€)</th>
                                    <th class="p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;">Действия</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="techmap : ${techmaps}" class="p-0 m-0" style="height: 25px;">
                                    <td class="text-center p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;" th:text="${techmap.serial}"></td>
                                    <td class="p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;" th:text="${techmap.descriptor}"></td>
                                    <td class="p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;" th:text="${techmap.time}"></td>
                                    <td class="p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;" th:text="${techmap.priceInEuros}"></td>
                                    <td class="p-0 m-0 text-xs leading-none" style="padding: 2px 4px; height: 25px;">
                                        <div class="flex gap-1">
                                            <button class="btn btn-xs btn-info h-4 min-h-4 px-1" th:onclick="'editTechmap(' + ${techmap.id} + ')'">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                                </svg>
                                            </button>
                                            <button class="btn btn-xs btn-error h-4 min-h-4 px-1" th:onclick="'deleteTechmap(' + ${techmap.id} + ')'">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                </svg>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth-helper.js"></script>
    <script type="module" src="/js/models.js"></script>
    <script type="module" src="/js/auth-menu.js"></script>
</body>
</html>
