<!DOCTYPE html>
<html lang="ru" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты работы</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <div class="container mx-auto p-4 lg:p-8">
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title text-2xl mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                    <span>Результаты работы</span>
                </h2>

                <!-- Calendar Display -->
                <div class="form-control flex justify-center py-0">
                    <label class="label justify-center py-0">
                        <span class="label-text font-medium">Календарь</span>
                    </label>
                    <div id="calendar" class="border rounded-lg p-1 bg-base-200 w-fit mx-auto">
                        <div class="flex justify-between items-center mb-1">
                            <button id="prevMonth" class="btn btn-xs btn-circle">◀</button>
                            <span id="calendarTitle" class="font-bold text-sm"></span>
                            <button id="nextMonth" class="btn btn-xs btn-circle">▶</button>
                        </div>
                        <div class="grid grid-cols-8 gap-0.5 text-center">
                            <div class="font-bold text-xs">Нед</div>
                            <div class="font-bold text-xs">Пн</div>
                            <div class="font-bold text-xs">Вт</div>
                            <div class="font-bold text-xs">Ср</div>
                            <div class="font-bold text-xs">Чт</div>
                            <div class="font-bold text-xs">Пт</div>
                            <div class="font-bold text-xs">Сб</div>
                            <div class="font-bold text-xs">Вс</div>
                        </div>
                        <div id="calendarDays" class="grid grid-cols-8 gap-0.5 mt-1"></div>
                    </div>
                </div>

                <!-- Radio buttons for period selection -->
                <div class="form-control flex justify-center py-0">
                    <label class="label justify-center py-0">
                        <span class="label-text font-medium">Период отображения</span>
                    </label>
                    <div class="flex gap-4 justify-center">
                        <label class="label cursor-pointer py-0">
                            <input type="radio" name="period" value="week" class="radio radio-primary" checked />
                            <span class="label-text ml-2">За неделю</span>
                        </label>
                        <label class="label cursor-pointer py-0">
                            <input type="radio" name="period" value="month" class="radio radio-primary" />
                            <span class="label-text ml-2">За месяц</span>
                        </label>
                    </div>
                </div>

                <!-- Date selectors -->
                <div class="flex justify-center gap-4 py-0">
                    <div class="form-control py-0">
                        <label class="label justify-center py-0">
                            <span class="label-text font-medium">Неделя</span>
                        </label>
                        <select id="weekSelect" class="select select-bordered w-fit py-1 px-2">
                            <option value="">-- Выберите неделю --</option>
                        </select>
                    </div>
                    <div class="form-control py-0">
                        <label class="label justify-center py-0">
                            <span class="label-text font-medium">Месяц</span>
                        </label>
                        <select id="monthSelect" class="select select-bordered w-fit py-1 px-2">
                            <option value="">-- Выберите месяц --</option>
                            <option value="1">Январь</option>
                            <option value="2">Февраль</option>
                            <option value="3">Март</option>
                            <option value="4">Апрель</option>
                            <option value="5">Май</option>
                            <option value="6">Июнь</option>
                            <option value="7">Июль</option>
                            <option value="8">Август</option>
                            <option value="9">Сентябрь</option>
                            <option value="10">Октябрь</option>
                            <option value="11">Ноябрь</option>
                            <option value="12">Декабрь</option>
                        </select>
                    </div>
                    <div class="form-control py-0">
                        <label class="label justify-center py-0">
                            <span class="label-text font-medium">Год</span>
                        </label>
                        <select id="yearSelect" class="select select-bordered w-fit py-1 px-2">
                            <option value="">-- Выберите год --</option>
                        </select>
                    </div>
                </div>

                <!-- Worker selector -->
                <div class="form-control py-0">
                    <div class="flex items-center gap-4">
                        <label class="label w-48 py-0">
                            <span class="label-text font-medium">Работник</span>
                        </label>
                        <!-- Select for users with multiple roles -->
                        <select id="employeeSelect" class="select select-bordered flex-1 hidden py-1 px-2">
                            <option value="">-- Выберите работника --</option>
                        </select>
                        <!-- Label for EMPLOYEE-only users -->
                        <label id="employeeLabel" class="label-text text-blue-800 font-semibold hidden"></label>
                        <input type="hidden" id="employeeIdInput">
                    </div>
                </div>

                <!-- Order selector -->
                <div class="form-control py-0">
                    <div class="flex items-center gap-4">
                        <label class="label w-48 py-0">
                            <span class="label-text font-medium">Заказ</span>
                        </label>
                        <select id="orderSelect" class="select select-bordered flex-1 py-1 px-2" disabled>
                            <option value="">-- Сначала выберите неделю --</option>
                        </select>
                    </div>
                </div>

                <!-- Model selector -->
                <div class="form-control py-0">
                    <div class="flex items-center gap-4">
                        <label class="label w-48 py-0">
                            <span class="label-text font-medium">Модель</span>
                        </label>
                        <select id="modelSelect" class="select select-bordered flex-1 py-1 px-2" disabled>
                            <option value="">-- Сначала выберите заказ --</option>
                        </select>
                    </div>
                </div>

                <!-- Section selector -->
                <div class="form-control py-0">
                    <div class="flex items-center gap-4">
                        <label class="label w-48 py-0">
                            <span class="label-text font-medium">Раздел</span>
                        </label>
                        <select id="sectionSelect" class="select select-bordered flex-1 py-1 px-2" disabled>
                            <option value="">-- Сначала выберите модель --</option>
                        </select>
                    </div>
                </div>

                <!-- Operation number selector -->
                <div class="form-control py-0">
                    <div class="flex items-center gap-4">
                        <label class="label w-48 py-0">
                            <span class="label-text font-medium">Номер операции</span>
                        </label>
                        <select id="operationSelect" class="select select-bordered flex-1 py-1 px-2" disabled>
                            <option value="">-- Сначала выберите модель и раздел --</option>
                        </select>
                    </div>
                </div>

                <!-- Quantity selector -->
                <div class="form-control py-0">
                    <div class="flex items-center gap-4">
                        <label class="label w-48 py-0">
                            <span class="label-text font-medium">Количество изделий</span>
                        </label>
                        <input type="number" id="quantityInput" min="1" value="1" class="input input-bordered flex-1 py-1 px-2" placeholder="Введите количество изделий" disabled>
                    </div>
                </div>

                <!-- Techmap info table (shown when operation is selected) -->
                <div id="techmapInfo" class="hidden py-0">
                    <label class="label py-0">
                        <span class="label-text font-medium">Информация об операции</span>
                    </label>
                    <div class="overflow-x-auto">
                        <table class="table table-zebra w-full">
                            <thead>
                                <tr>
                                    <th>Номер</th>
                                    <th>Описание</th>
                                    <th>Время</th>
                                    <th>Расценка</th>
                                </tr>
                            </thead>
                            <tbody id="techmapTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Add button -->
                <div class="form-control mt-2 py-0">
                    <button type="button" id="addButton" class="btn btn-primary w-full" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        Добавить
                    </button>
                </div>

                <!-- Summary -->
                <div id="summarySection" class="hidden stats stats-vertical lg:stats-horizontal shadow w-full mt-6 mb-6">
                    <div class="stat">
                        <div class="stat-figure text-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div class="stat-title">Общее время</div>
                        <div class="stat-value text-primary" id="totalTime">00:00:00</div>
                        <div class="stat-desc">За указанный период</div>
                    </div>
                    <div class="stat">
                        <div class="stat-figure text-secondary">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div class="stat-title">Общая сумма</div>
                        <div class="stat-value text-secondary" id="totalEarnings">€0.000</div>
                        <div class="stat-desc">За указанный период</div>
                    </div>
                </div>

                <!-- Work results table -->
                <div class="mt-8">
                    <h3 class="font-bold text-lg mb-4">Добавленные результаты работы</h3>
                    <div class="overflow-x-auto">
                        <table class="table table-zebra w-full">
                            <thead>
                                <tr>
                                    <th>Заказ</th>
                                    <th>Модель</th>
                                    <th>Раздел</th>
                                    <th>Операция</th>
                                    <th>Количество</th>
                                    <th>Стоимость (€)</th>
                                    <th>Действия</th>
                                </tr>
                            </thead>
                            <tbody id="workResultsTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth-helper.js"></script>
    <script type="module" src="/js/work-results.js"></script>
    <script type="module" src="/js/auth-menu.js"></script>
</body>
</html>
