<!DOCTYPE html>
<html lang="ru" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты работы</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #weekSelect, #monthSelect, #yearSelect {
            height: 25px !important;
            min-height: 25px !important;
            padding-top: 2px !important;
            padding-bottom: 2px !important;
            font-size: 13px !important;
        }
        #weekSelect option, #monthSelect option, #yearSelect option {
            padding: 2px 8px !important;
            font-size: 13px !important;
        }
    </style>
</head>
<body class="min-h-screen bg-base-200">
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <div class="container mx-auto p-4 lg:p-8">
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <h2 class="card-title text-2xl mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                    <span>Результаты работы</span>
                </h2>

                <!-- Calendar Display -->
                <div class="form-control flex justify-center py-0">
                    <label class="label justify-center py-0">
                        <span class="label-text font-medium">Календарь</span>
                    </label>
                    <div id="calendar" class="border rounded-lg p-1 bg-base-200 w-fit mx-auto">
                        <div class="flex justify-between items-center mb-1">
                            <button id="prevMonth" class="btn btn-xs btn-circle">◀</button>
                            <span id="calendarTitle" class="font-bold text-sm"></span>
                            <button id="nextMonth" class="btn btn-xs btn-circle">▶</button>
                        </div>
                        <div class="grid grid-cols-8 gap-0.5 text-center">
                            <div class="font-bold text-xs">Нед</div>
                            <div class="font-bold text-xs">Пн</div>
                            <div class="font-bold text-xs">Вт</div>
                            <div class="font-bold text-xs">Ср</div>
                            <div class="font-bold text-xs">Чт</div>
                            <div class="font-bold text-xs">Пт</div>
                            <div class="font-bold text-xs">Сб</div>
                            <div class="font-bold text-xs">Вс</div>
                        </div>
                        <div id="calendarDays" class="grid grid-cols-8 gap-0.5 mt-1"></div>
                    </div>
                </div>

                <!-- Radio buttons for period selection -->
                <div class="form-control flex justify-center py-0">
                    <label class="label justify-center py-0">
                        <span class="label-text font-medium">Период отображения</span>
                    </label>
                    <div class="flex gap-4 justify-center">
                        <label class="label cursor-pointer py-0">
                            <input type="radio" name="period" value="week" class="radio radio-primary" checked />
                            <span class="label-text ml-2">За неделю</span>
                        </label>
                        <label class="label cursor-pointer py-0">
                            <input type="radio" name="period" value="month" class="radio radio-primary" />
                            <span class="label-text ml-2">За месяц</span>
                        </label>
                    </div>
                </div>

                <!-- Date selectors -->
                <div class="flex justify-center gap-4 py-0">
                    <div class="form-control py-0">
                        <label class="label justify-center py-0">
                            <span class="label-text font-medium">Неделя</span>
                        </label>
                        <select id="weekSelect" class="select select-bordered py-0 px-1" style="width: 64px;">
                            <option value="">-- Выберите неделю --</option>
                        </select>
                    </div>
                    <div class="form-control py-0">
                        <label class="label justify-center py-0">
                            <span class="label-text font-medium">Месяц</span>
                        </label>
                        <select id="monthSelect" class="select select-bordered py-0 px-1" style="width: 100px;">
                            <option value="">-- Выберите месяц --</option>
                            <option value="1">Январь</option>
                            <option value="2">Февраль</option>
                            <option value="3">Март</option>
                            <option value="4">Апрель</option>
                            <option value="5">Май</option>
                            <option value="6">Июнь</option>
                            <option value="7">Июль</option>
                            <option value="8">Август</option>
                            <option value="9">Сентябрь</option>
                            <option value="10">Октябрь</option>
                            <option value="11">Ноябрь</option>
                            <option value="12">Декабрь</option>
                        </select>
                    </div>
                    <div class="form-control py-0">
                        <label class="label justify-center py-0">
                            <span class="label-text font-medium">Год</span>
                        </label>
                        <select id="yearSelect" class="select select-bordered w-20 py-0 px-1">
                            <option value="">-- Выберите год --</option>
                        </select>
                    </div>
                </div>

                <!-- Form selectors container -->
                <div class="px-4 lg:px-36">
                    <!-- Worker selector -->
                    <div class="form-control py-[3px]">
                        <div class="flex items-center gap-[40px]">
                            <label class="label w-32 lg:w-48 py-0 justify-end">
                                <span class="label-text font-medium text-sm lg:text-base">Работник</span>
                            </label>
                            <!-- Select for users with multiple roles -->
                            <select id="employeeSelect" class="select select-bordered flex-1 hidden py-0 px-1 text-sm lg:text-base" style="padding-top: 2px; padding-bottom: 2px; min-height: 25px !important; height: 25px !important;">
                                <option value="">-- Выберите работника --</option>
                            </select>
                            <!-- Label for EMPLOYEE-only users -->
                            <label id="employeeLabel" class="label-text text-blue-800 font-semibold hidden text-sm lg:text-base"></label>
                            <input type="hidden" id="employeeIdInput">
                        </div>
                    </div>

                    <!-- Order selector -->
                    <div class="form-control py-[3px]">
                        <div class="flex items-center gap-[40px]">
                            <label class="label w-32 lg:w-48 py-0 justify-end">
                                <span class="label-text font-medium text-sm lg:text-base">Заказ</span>
                            </label>
                            <select id="orderSelect" class="select select-bordered flex-1 py-0 px-1 text-sm lg:text-base" disabled style="padding-top: 2px; padding-bottom: 2px; min-height: 25px !important; height: 25px !important;">
                                <option value="">-- Сначала выберите неделю --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Model selector -->
                    <div class="form-control py-[3px]">
                        <div class="flex items-center gap-[40px]">
                            <label class="label w-32 lg:w-48 py-0 justify-end">
                                <span class="label-text font-medium text-sm lg:text-base">Модель</span>
                            </label>
                            <select id="modelSelect" class="select select-bordered flex-1 py-0 px-1 text-sm lg:text-base" disabled style="padding-top: 2px; padding-bottom: 2px; min-height: 25px !important; height: 25px !important;">
                                <option value="">-- Сначала выберите заказ --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Section selector -->
                    <div class="form-control py-[3px]">
                        <div class="flex items-center gap-[40px]">
                            <label class="label w-32 lg:w-48 py-0 justify-end">
                                <span class="label-text font-medium text-sm lg:text-base">Раздел</span>
                            </label>
                            <select id="sectionSelect" class="select select-bordered w-32 lg:w-64 py-0 px-1 text-sm lg:text-base" disabled style="padding-top: 2px; padding-bottom: 2px; min-height: 25px !important; height: 25px !important;">
                                <option value="">-- Сначала выберите модель --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Operation number selector -->
                    <div class="form-control py-[3px]">
                        <div class="flex items-center gap-[40px]">
                            <label class="label w-32 lg:w-48 py-0 justify-end">
                                <span class="label-text font-medium text-sm lg:text-base">Номер операции</span>
                            </label>
                            <select id="operationSelect" class="select select-bordered w-16 lg:w-36 py-0 px-1 text-sm lg:text-base" disabled style="padding-top: 2px; padding-bottom: 2px; min-height: 25px !important; height: 25px !important;">
                                <option value="">-- Выберите модель и раздел --</option>
                            </select>
                        </div>
                    </div>

                    <!-- Quantity selector -->
                    <div class="form-control py-[3px]">
                        <div class="flex items-center gap-[40px]">
                            <label class="label w-32 lg:w-48 py-0 justify-end">
                                <span class="label-text font-medium text-sm lg:text-base">Количество изделий</span>
                            </label>
                            <select id="quantitySelect" class="select select-bordered w-20 py-0 px-1 text-sm lg:text-base" disabled style="padding-top: 2px; padding-bottom: 2px; min-height: 25px !important; height: 25px !important;">
                                <option value="">0</option>
                            </select>
                        </div>
                    </div>

                    <!-- Techmap info table (shown when operation is selected) -->
                    <div id="techmapInfo" class="hidden py-[2px]">
                        <div class="overflow-x-auto">
                            <table class="table table-zebra w-full" style="table-layout: fixed;">
                                <colgroup>
                                    <col style="width: 15%;">
                                    <col style="width: 50%;">
                                    <col style="width: 15%;">
                                    <col style="width: 20%;">
                                </colgroup>
                                <style>
                                    #techmapTableBody td {
                                        height: 25px !important;
                                        padding: 2px 8px !important;
                                        text-align: left !important;
                                    }
                                    #techmapTableBody td:first-child {
                                        text-align: center !important;
                                    }
                                    #techmapTableBody th {
                                        height: 25px !important;
                                        padding: 2px 8px !important;
                                        text-align: left !important;
                                        color: #3b82f6 !important;
                                        font-weight: 700 !important;
                                        background-color: #eff6ff !important;
                                    }
                                </style>
                                <thead>
                                    <tr>
                                        <th style="text-align: center; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">№</th>
                                        <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Описание</th>
                                        <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Время</th>
                                        <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Расценка</th>
                                    </tr>
                                </thead>
                                <tbody id="techmapTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Add button -->
                    <div class="form-control mt-2 py-[3px]">
                        <button type="button" id="addButton" class="btn btn-primary w-full text-sm lg:text-base" disabled style="height: 30px; min-height: 30px;">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            Добавить
                        </button>
                    </div>
                </div>

                <!-- Summary -->
                <div id="summarySection" class="hidden stats stats-vertical lg:stats-horizontal shadow w-full mt-6 mb-6">
                    <div class="stat">
                        <div class="stat-title text-right">Общее время</div>
                        <div class="stat-value text-primary text-right text-sm lg:text-base" id="totalTime">00:00:00</div>
                        <div class="stat-desc text-right">За указанный период</div>
                    </div>
                    <div class="stat">
                        <div class="stat-title text-right">Общая сумма</div>
                        <div class="stat-value text-secondary text-right text-sm lg:text-base" id="totalEarnings">0.000</div>
                        <div class="stat-desc text-right">За указанный период</div>
                    </div>
                </div>

                <!-- Work results table -->
                <div class="mt-8">
                    <h3 class="font-bold text-lg mb-4">Добавленные результаты работы</h3>
                    <div class="overflow-x-auto">
                        <table class="table table-zebra w-full" style="table-layout: fixed;">
                            <colgroup>
                                <col style="width: 12%;">
                                <col style="width: 35%;">
                                <col style="width: 15%;">
                                <col style="width: 12%;">
                                <col style="width: 10%;">
                                <col style="width: 10%;">
                                <col style="width: 6%;">
                            </colgroup>
                            <style>
                                #workResultsTableBody td {
                                    height: 25px !important;
                                    padding: 2px 8px !important;
                                    text-align: left !important;
                                }
                                #workResultsTableBody th {
                                    padding: 4px 8px !important;
                                    white-space: normal !important;
                                    word-wrap: break-word !important;
                                    text-align: left !important;
                                    color: #3b82f6 !important;
                                    font-weight: 700 !important;
                                    background-color: #eff6ff !important;
                                }
                            </style>
                            <thead>
                                <tr>
                                    <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Заказ</th>
                                    <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Модель</th>
                                    <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Раздел</th>
                                    <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Номер<br>операции</th>
                                    <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Кол-<br>во</th>
                                    <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;">Сумма</th>
                                    <th style="text-align: left; color: #2563eb; font-weight: 700; background-color: #dbeafe !important;"></th>
                                </tr>
                            </thead>
                            <tbody id="workResultsTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth-helper.js"></script>
    <script type="module" src="/js/work-results.js?v=3"></script>
    <script type="module" src="/js/auth-menu.js"></script>
</body>
</html>
