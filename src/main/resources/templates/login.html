<!DOCTYPE html>
<html lang="ru" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200">
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="flex items-center justify-center" style="min-height: calc(100vh - 64px);">
    <div class="card bg-base-100 shadow-xl w-full max-w-md mx-4">
        <div class="card-body">
            <h2 class="card-title text-2xl mb-6 justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                Вход в систему
            </h2>
            
            <form id="loginForm" method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Логин</span>
                    </label>
                    <input type="text" id="login" required class="input input-bordered w-full" placeholder="Введите логин" autocomplete="username">
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text font-medium">Пароль</span>
                    </label>
                    <input type="password" id="password" required class="input input-bordered w-full" placeholder="Введите пароль" autocomplete="current-password">
                </div>

                <div class="form-control mt-6">
                    <button type="submit" id="loginButton" class="btn btn-primary w-full">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                        </svg>
                        Войти
                    </button>
                </div>
            </form>

            <div id="errorMessage" class="alert alert-error mt-4 hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="errorText"></span>
            </div>
        </div>
    </div>

    <script type="module" src="/js/login.js?v=2"></script>
</body>
</html>
