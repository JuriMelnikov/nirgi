spring.application.name=nirgi-java
# ????????? ??????????? ? ??
spring.datasource.url=jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE}?createDatabaseIfNotExist=true
spring.datasource.username=${MARIADB_USER}
spring.datasource.password=${MARIADB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# CORS configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# ????????? ???????????? (???? ??? ??????????)
# spring.security.user.name=admin
# spring.security.user.password=password

# Thymeleaf configuration
spring.thymeleaf.prefix=file:/app/templates/
spring.thymeleaf.suffix=.html
spring.webmvc.static-path-pattern=/**
spring.web.resources.static-locations=file:/app/static/,classpath:/static/

# Enable template cache for production
spring.thymeleaf.cache=false

# Timezone configuration
spring.jackson.time-zone=Europe/Tallinn
user.timezone=Europe/Tallinn

# Logging configuration
logging.level.ee.jvm.nirgi_java.security=INFO
logging.level.org.springframework.security=INFO
