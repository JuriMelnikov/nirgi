name: Continuous Deployment to Debian 13

on:
  push:
    branches: [ main ]

jobs:
  # ЭТАП 1: Автоматическое тестирование с базой данных MariaDB
  test:
    runs-on: ubuntu-latest

    # Запуск MariaDB в качестве сервисного контейнера
    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: nirgi_db_test  # Имя тестовой базы данных
          MARIADB_USER: nirgi_user
          MARIADB_PASSWORD: nirgi_password
        ports:
          - 3306:3306
        # Проверка готовности БД перед запуском тестов
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Передаем параметры подключения к тестовой БД через ENV-переменные для Spring Boot
      - name: Run Maven Tests
        run: mvn clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/nirgi_db_test
          SPRING_DATASOURCE_USERNAME: nirgi_user
          SPRING_DATASOURCE_PASSWORD: nirgi_password

  # ЭТАП 2: Деплой на ваш сервер
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH to Debian 13
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            # 1. Переходим в директорию проекта
            cd /srv/nirgi-java

            # 2. Скачиваем свежие изменения
            git pull origin main

            # 3. Пересобираем и запускаем приложение
            docker compose up -d --build app

            # 4. Очищаем неиспользуемые слои
            docker image prune -f

