name: Continuous Deployment to Debian 13

on:
  push:
    branches: [ main ]

jobs:
  # ЭТАП 1: Автоматическое тестирование
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests
        run: mvn clean test

  # ЭТАП 2: Деплой на ваш сервер
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH to Debian 13
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            # 1. Переходим в директорию проекта
            cd /srv/nirgi-java

            # 2. Скачиваем свежие изменения
            git pull origin main

            # 3. Пересобираем и запускаем приложение
            docker compose up -d --build app

            # 4. Очищаем неиспользуемые слои
            docker image prune -f

